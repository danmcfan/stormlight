name: Swarm deploy

# Tests + builds the swarm dashboard on every relevant push, then (only when
# the repository variable SWARM_DEPLOY_HOST is set) deploys to the VPS over
# Tailscale SSH. See ops/vps/README.md.
on:
  push:
    branches: [main]
    paths: ['swarm/**', 'ops/vps/**', '.github/workflows/swarm-deploy.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: swarm-deploy
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: swarm
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: swarm/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build

  deploy:
    needs: test
    if: ${{ vars.SWARM_DEPLOY_HOST != '' }}
    runs-on: ubuntu-latest
    env:
      DEPLOY_HOST: ${{ vars.SWARM_DEPLOY_HOST }}
      DEPLOY_USER: ${{ vars.SWARM_DEPLOY_USER || 'deploy' }}
    steps:
      - name: Join the tailnet
        uses: tailscale/github-action@v4.4.0
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci
      - name: Deploy over Tailscale SSH
        run: |
          # Tailscale SSH authenticates by node identity; no keys are involved.
          tailscale ssh "$DEPLOY_USER@$DEPLOY_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          cd /srv/swarm
          git fetch origin main
          git merge --ff-only origin/main
          exec ./ops/vps/update-swarm.sh
          REMOTE
