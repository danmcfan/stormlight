<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Shattered Plains app icon: a Shardblade crossing a brass ring, a stormlight gem at the hilt. -->
  <defs>
    <radialGradient id="bg" cx="50%" cy="42%" r="70%">
      <stop offset="0" stop-color="#1f2b3d"/>
      <stop offset="0.65" stop-color="#101724"/>
      <stop offset="1" stop-color="#0a0f17"/>
    </radialGradient>
    <linearGradient id="blade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8fa3b8"/>
      <stop offset="0.48" stop-color="#eef6ff"/>
      <stop offset="0.52" stop-color="#b9c8d8"/>
      <stop offset="1" stop-color="#5d6f84"/>
    </linearGradient>
    <linearGradient id="brass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f1dca8"/>
      <stop offset="1" stop-color="#a8823c"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#a8e0ff" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#a8e0ff" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="512" height="512" fill="url(#bg)"/>
  <!-- Stormlight haze behind the blade -->
  <circle cx="256" cy="240" r="190" fill="url(#glow)" opacity="0.18"/>
  <!-- Brass ring with four gem settings -->
  <circle cx="256" cy="256" r="164" fill="none" stroke="url(#brass)" stroke-width="7" opacity="0.85"/>
  <circle cx="256" cy="256" r="150" fill="none" stroke="#cfb27a" stroke-width="1.5" opacity="0.4"/>
  <g fill="#a8e0ff">
    <rect x="249" y="85" width="14" height="14" transform="rotate(45 256 92)"/>
    <rect x="249" y="413" width="14" height="14" transform="rotate(45 256 420)"/>
    <rect x="85" y="249" width="14" height="14" transform="rotate(45 92 256)"/>
    <rect x="413" y="249" width="14" height="14" transform="rotate(45 420 256)"/>
  </g>
  <!-- The Shardblade: long, slightly curved, with a notched spine -->
  <g transform="rotate(-38 256 256)">
    <path d="M244 360 L244 96 Q244 62 262 34 Q276 70 270 104 L278 120 L270 136 L270 360 Z" fill="url(#blade)" stroke="#0a0f17" stroke-width="3"/>
    <path d="M257 352 L257 100" stroke="#ffffff" stroke-opacity="0.45" stroke-width="2"/>
    <!-- Crossguard -->
    <path d="M206 360 Q256 340 306 360 L300 380 Q256 368 212 380 Z" fill="url(#brass)" stroke="#0a0f17" stroke-width="3"/>
    <!-- Grip and pommel -->
    <rect x="248" y="378" width="18" height="70" rx="4" fill="#3a2a1c" stroke="#0a0f17" stroke-width="3"/>
    <rect x="247" y="446" width="20" height="20" transform="rotate(45 257 456)" fill="url(#brass)" stroke="#0a0f17" stroke-width="3"/>
    <!-- Stormlight gem set in the guard -->
    <circle cx="257" cy="362" r="22" fill="url(#glow)"/>
    <rect x="248" y="353" width="18" height="18" transform="rotate(45 257 362)" fill="#cfefff" stroke="#ffffff" stroke-width="2"/>
  </g>
</svg>
