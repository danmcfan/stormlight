<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Shardplate preview</title>
    <style>
      :root {
        color-scheme: light;
        --ink: #1d232b;
        --muted: #5c6672;
        --line: #c2c9d1;
        --paper: #f2f4f6;
        --card: #fff;
        --accent: #2f5fb3;
        --good: #2e7d4f;
        --ok: #9a6b12;
        --weak: #b23b3b;
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; height: 100%; }
      body {
        font: 13px/1.4 ui-sans-serif, -apple-system, system-ui, sans-serif;
        color: var(--ink);
        background: var(--paper);
        display: flex;
        flex-direction: column;
      }
      header {
        display: flex;
        align-items: center;
        flex-wrap: wrap;
        gap: 8px;
        padding: 8px 12px;
        border-bottom: 1px solid var(--line);
        background: #fff;
      }
      header h1 { font-size: 13px; font-weight: 600; margin: 0 6px 0 0; white-space: nowrap; }
      header label { display: inline-flex; align-items: center; gap: 4px; color: var(--muted); }
      .seg { display: inline-flex; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; }
      .seg button { border: 0; border-radius: 0; border-right: 1px solid var(--line); }
      .seg button:last-child { border-right: 0; }
      .seg button.on { background: #dbe7f7; font-weight: 600; }
      select, button {
        font: inherit;
        color: inherit;
        border: 1px solid var(--line);
        background: #fff;
        border-radius: 5px;
        padding: 3px 8px;
      }
      button { cursor: pointer; }
      button:hover, select:hover { border-color: #96a0ab; }
      #status {
        margin-left: auto;
        color: var(--muted);
        font-variant-numeric: tabular-nums;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      main { flex: 1 1 auto; display: flex; min-height: 0; }

      /* Pieces (left) */
      #pieces {
        flex: 0 0 168px;
        border-right: 1px solid var(--line);
        background: #fff;
        overflow: auto;
        padding: 6px 4px;
      }
      #pieces h2, #side h2 {
        font-size: 11px;
        text-transform: uppercase;
        letter-spacing: 0.6px;
        color: var(--muted);
        margin: 6px 6px 4px;
        font-weight: 600;
      }
      .piece {
        display: flex;
        justify-content: space-between;
        width: 100%;
        border: 0;
        background: none;
        border-radius: 4px;
        padding: 3px 6px;
        text-align: left;
        font-variant-numeric: tabular-nums;
      }
      .piece span:last-child { color: var(--muted); }
      .piece:hover { background: #eef2f7; }
      .piece.on { background: #dbe7f7; font-weight: 600; }

      /* Viewport */
      #app { flex: 1 1 auto; position: relative; min-width: 0; }
      #app canvas { display: block; position: absolute; inset: 0; width: 100%; height: 100%; }
      #focusTag {
        position: absolute;
        left: 10px;
        top: 10px;
        background: rgba(255, 255, 255, 0.9);
        border: 1px solid var(--line);
        border-radius: 6px;
        padding: 6px 8px;
        max-width: min(520px, calc(100% - 20px));
        display: none;
      }
      #focusTag b { font-size: 14px; }
      #focusTag table { border-collapse: collapse; margin-top: 4px; font-size: 12px; }
      #focusTag td { padding: 2px 6px 2px 0; vertical-align: top; }
      #focusTag td:first-child { color: var(--muted); white-space: nowrap; }

      /* Comparison sidebar (right) */
      #side {
        flex: 0 0 400px;
        border-left: 1px solid var(--line);
        background: var(--paper);
        overflow: auto;
        padding: 6px 10px 16px;
      }
      .card {
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 8px;
        margin: 0 0 10px;
        overflow: hidden;
      }
      .card.dim { opacity: 0.45; }
      .card-head {
        display: flex;
        align-items: baseline;
        gap: 8px;
        padding: 6px 8px;
        border-bottom: 1px solid #e4e8ec;
      }
      .card-head b { font-size: 13px; }
      .scores { margin-left: auto; display: flex; gap: 6px; font-variant-numeric: tabular-nums; font-size: 12px; }
      .scores span { white-space: nowrap; }
      .s-good { color: var(--good); }
      .s-ok { color: var(--ok); }
      .s-weak { color: var(--weak); font-weight: 600; }
      .pair { display: grid; grid-template-columns: 1fr 1fr; gap: 1px; background: #e4e8ec; }
      .pair figure { margin: 0; background: #c8c8c8; position: relative; cursor: zoom-in; }
      .pair img, .pair canvas { display: block; width: 100%; height: auto; }
      .pair figcaption {
        position: absolute;
        left: 4px;
        bottom: 4px;
        font-size: 10px;
        background: rgba(255, 255, 255, 0.85);
        padding: 0 4px;
        border-radius: 3px;
      }
      .card-foot { display: flex; gap: 6px; padding: 6px 8px; flex-wrap: wrap; }
      .card-foot button { font-size: 12px; padding: 2px 7px; }
      .card-foot .meta { margin-left: auto; color: var(--muted); font-size: 11px; align-self: center; }
      .notes { padding: 0 8px 6px; color: var(--muted); font-size: 11px; }

      .thumbs { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-bottom: 10px; }
      .thumbs figure {
        margin: 0;
        background: #fff;
        border: 1px solid var(--line);
        border-radius: 6px;
        overflow: hidden;
        cursor: zoom-in;
      }
      .thumbs figure.hit { outline: 2px solid var(--accent); }
      .thumbs img { display: block; width: 100%; aspect-ratio: 1; object-fit: cover; }
      .thumbs figcaption { font-size: 11px; padding: 3px 6px; color: var(--muted); }
      details summary { cursor: pointer; margin: 6px 6px 6px; color: var(--muted); font-size: 12px; }

      /* Lightbox */
      #lightbox {
        position: fixed;
        inset: 0;
        background: rgba(14, 18, 24, 0.86);
        display: none;
        align-items: center;
        justify-content: center;
        z-index: 50;
        padding: 20px;
        cursor: zoom-out;
      }
      #lightbox.open { display: flex; }
      #lightbox .inner { display: flex; gap: 8px; max-width: 100%; max-height: 100%; }
      #lightbox img, #lightbox canvas {
        max-height: calc(100vh - 60px);
        max-width: calc(50vw - 30px);
        object-fit: contain;
        background: #c8c8c8;
      }
      #lightbox .inner > img:only-child, #lightbox .inner > div canvas { max-width: calc(100vw - 40px); }
      #lightbox .cap { position: fixed; left: 20px; bottom: 12px; color: #dfe5ec; }

      @media (max-width: 900px) {
        main { flex-direction: column; overflow: auto; }
        #pieces { flex: none; display: flex; flex-wrap: wrap; border-right: 0; border-bottom: 1px solid var(--line); }
        #pieces h2 { width: 100%; }
        .piece { width: auto; gap: 6px; }
        #app { flex: none; height: 62vh; }
        #side { flex: none; border-left: 0; border-top: 1px solid var(--line); }
      }
    </style>
  </head>
  <body>
    <header>
      <h1>Shardplate preview</h1>
      <span class="seg" id="views">
        <button data-view="front">Front</button>
        <button data-view="left">Side</button>
        <button data-view="back">Back</button>
        <button data-view="three">¾</button>
      </span>
      <label><input type="checkbox" id="ortho" /> ortho</label>
      <label>pose
        <select id="pose">
          <option value="compare">reference (45°)</option>
          <option value="apose">A-pose</option>
          <option value="rest">game rest</option>
        </select>
      </label>
      <label>others
        <select id="focusMode">
          <option value="ghost">ghosted</option>
          <option value="hide">hidden</option>
          <option value="show">shown</option>
        </select>
      </label>
      <label><input type="checkbox" id="spin" /> spin</label>
      <span id="status"></span>
    </header>
    <main>
      <nav id="pieces"></nav>
      <div id="app"><div id="focusTag"></div></div>
      <aside id="side">
        <h2>Reference vs. model</h2>
        <div id="compare"></div>
        <h2 id="partsHead">Part sheets</h2>
        <div class="thumbs" id="parts"></div>
        <details>
          <summary>Inspiration (third-party art, not ours)</summary>
          <div class="thumbs" id="inspo"></div>
        </details>
      </aside>
    </main>
    <div id="lightbox"><div class="inner"></div><div class="cap"></div></div>
    <script type="module" src="./plate.js"></script>
  </body>
</html>
