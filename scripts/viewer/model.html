<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Stormlight — model viewer</title>
    <style>
      :root {
        color-scheme: light;
        --ink: #1d232b;
        --muted: #5c6672;
        --line: #c2c9d1;
        --paper: #f2f4f6;
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; height: 100%; }
      body {
        font: 13px/1.4 ui-sans-serif, -apple-system, system-ui, sans-serif;
        color: var(--ink);
        background: var(--paper);
        display: flex;
        flex-direction: column;
      }
      header {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 8px 12px;
        border-bottom: 1px solid var(--line);
        background: #fff;
        flex: 0 0 auto;
      }
      header h1 {
        font-size: 13px;
        font-weight: 600;
        margin: 0;
        letter-spacing: 0.2px;
        white-space: nowrap;
      }
      header .sub { color: var(--muted); }
      #status {
        margin-left: auto;
        color: var(--muted);
        font-variant-numeric: tabular-nums;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      select, button {
        font: inherit;
        color: inherit;
        border: 1px solid var(--line);
        background: #fff;
        border-radius: 5px;
        padding: 3px 7px;
      }
      button { cursor: pointer; }
      button:hover, select:hover { border-color: #96a0ab; }
      main { flex: 1 1 auto; display: flex; min-height: 0; }
      #app { flex: 1 1 auto; position: relative; min-width: 0; }
      #app canvas { display: block; }
      #panel {
        flex: 0 0 232px;
        border-left: 1px solid var(--line);
        background: #fff;
        overflow: auto;
        padding: 4px;
      }
      .row {
        display: grid;
        grid-template-columns: 1fr 26px 62px;
        gap: 4px;
        width: 100%;
        padding: 3px 6px;
        border: 0;
        background: none;
        border-radius: 4px;
        text-align: right;
        font-variant-numeric: tabular-nums;
        cursor: pointer;
      }
      .row span:first-child { text-align: left; overflow: hidden; text-overflow: ellipsis; }
      .row.head, .row.head:hover { color: var(--muted); cursor: default; background: none; }
      .row.head span:last-child { text-align: right; }
      .row:not(.head):hover { background: #eef2f7; }
      .row.on { background: #dbe7f7; font-weight: 600; }
      .lil-gui { --width: 220px; z-index: 10; }
      @media (max-width: 720px) {
        #panel { display: none; }
        header .sub { display: none; }
      }
    </style>
  </head>
  <body>
    <header>
      <h1>Stormlight model viewer</h1>
      <span class="sub">glTF pieces, game materials, live reload</span>
      <select id="model"></select>
      <button id="reset" title="Reset the camera and show every piece">frame all</button>
      <span id="status"></span>
    </header>
    <main>
      <div id="app"></div>
      <div id="panel"></div>
    </main>
    <script type="module" src="./main.js"></script>
  </body>
</html>
